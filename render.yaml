# Blueprint do Render: plano gratuito, sem dependências para instalar.
# Depois de criar o serviço, adicione a variável ADMIN_KEY em Environment (veja o README).
services:
  - type: web
    name: tribunal-do-amor
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
